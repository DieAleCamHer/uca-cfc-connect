# ==========================================
# Perfil PROD - MySQL "productivo"
# ==========================================
# Para el proyecto de catedra, "prod" simplemente significa una base
# de datos distinta a la de desarrollo, sin auto-actualizacion de esquema
# (mas parecido a un ambiente real). Crea la base antes de correr:
#    CREATE DATABASE ucacfc_prod CHARACTER SET utf8mb4;

spring.datasource.url=jdbc:mysql://localhost:3306/ucacfc_prod?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En prod NO dejamos que Hibernate modifique el esquema solo.
# "validate" revisa que las entidades coincidan con las tablas existentes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
