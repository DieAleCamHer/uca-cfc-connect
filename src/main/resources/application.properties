spring.application.name=uca-cfc-connect

# Perfil activo por defecto. Cambialo a "prod" cuando lo necesites,
# o pasa -Dspring.profiles.active=prod al ejecutar.
spring.profiles.active=dev

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# JWT (Bloque 6)
# ==========================================
# IMPORTANTE: este secreto es solo para desarrollo/entrega academica.
# Nunca se sube un secreto real de produccion a un repositorio publico.
# Debe tener al menos 32 caracteres (256 bits) para el algoritmo HS256.
jwt.secret=uca-cfc-connect-secreto-academico-dwf404-udb-2026-cambiar-en-produccion
# 24 horas en milisegundos
jwt.expiration-ms=86400000
