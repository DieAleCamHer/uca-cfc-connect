spring.application.name=uca-cfc-connect
server.port=8080

# ---------- Base de datos (MySQL) ----------
# La base se crea sola si no existe. Ajusta usuario/clave o usa variables de entorno DB_USERNAME / DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/ucacfc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/El_Salvador

# ---------- JSON ----------
# Un campo desconocido en el body (por ejemplo "rol" en el registro publico) se rechaza con 400.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/El_Salvador

# ---------- CORS ----------
# Origenes que pueden llamar a la API desde el navegador. "*" = cualquiera (el token va en header, no en cookies).
# Para restringir: app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ---------- JWT ----------
# Secreto HMAC de minimo 64 caracteres (HS512). Solo para uso academico; en produccion va en variable de entorno.
app.jwt.secret=${JWT_SECRET:uca-cfc-connect-dwf404-secreto-academico-cambiar-en-produccion-0123456789-abcdefghij}
app.jwt.access-minutes=30
app.jwt.refresh-days=7

# ---------- Reglas de negocio configurables ----------
app.zona-horaria=America/El_Salvador
# Horas minimas de anticipacion para pedir catering (preparacion de alimentos)
app.reglas.catering-anticipacion-horas=24
# Un CLIENTE puede cancelar por su cuenta reservas y catering hasta estas horas antes del inicio
app.reglas.cancelacion-cliente-horas=24
# Dias de vigencia por defecto de una cotizacion
app.reglas.cotizacion-vigencia-dias=15
# Cada cuanto corre el cierre automatico (ms)
app.cierre.intervalo-ms=900000

# ---------- Recuperacion de contrasena ----------
app.recuperacion.expiracion-minutos=30
# No hay servidor de correo: en modo academico el token se devuelve en la respuesta y se escribe en el log.
app.recuperacion.mostrar-token=true

# ---------- Datos iniciales ----------
app.admin.nombre=Administrador CFC
app.admin.email=admin@ucacfc.edu.sv
app.admin.password=Admin12345
# Crea catalogos, personal y oferta de ejemplo solo si la base esta vacia
app.seed.datos-demo=true

logging.level.edu.udb.ucacfc=INFO
