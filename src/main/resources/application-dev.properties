# ==========================================
# Perfil DEV - MySQL local
# ==========================================
# 1. Instala MySQL Community Server (gratis): https://dev.mysql.com/downloads/mysql/
# 2. Crea la base de datos antes de correr la app:
#    CREATE DATABASE ucacfc_dev CHARACTER SET utf8mb4;
# 3. Ajusta usuario/password abajo segun tu instalacion local.

spring.datasource.url=jdbc:mysql://localhost:3306/ucacfc_dev?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En dev dejamos que Hibernate actualice el esquema automaticamente
# a partir de las entidades (comodo mientras el modelo cambia seguido).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=DEBUG
