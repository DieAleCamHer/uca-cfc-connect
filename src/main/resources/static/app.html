<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCA-CFC Connect</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="marca">UCA · Formación Continua</div>
      <h2>UCA-CFC Connect</h2>
    </div>

    <nav id="navContainer" style="flex:1; overflow-y:auto; padding-bottom:10px;"></nav>

    <div class="sidebar-footer">
      <div class="usuario-nombre" id="usuarioNombre">—</div>
      <div class="usuario-rol" id="usuarioRol">—</div>
      <button class="btn btn-secundario" style="width:100%" onclick="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="tituloModulo">Bienvenido</h1>
    </div>
    <div class="content" id="contentArea">
      <div class="card">
        <p style="color:var(--gris-texto); margin:0;">
          Selecciona un módulo del menú izquierdo para comenzar.
        </p>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Formulario</h3>
      <button class="cerrar" onclick="cerrarModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-dorado" id="modalGuardarBtn">Guardar</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/config.js"></script>
<script src="js/crud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
